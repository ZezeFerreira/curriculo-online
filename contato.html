<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio - José Matheus</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Bem vindos</div>

            <button class="menu-toggle" onclick="toggleMenu()">☰</button>

            <ul class="menu" id="menu">
                <li><a href="./index.html">Sobre mim</a></li>
                <li><a href="./formacao.html">Formação</a></li>
                <li><a href="./portfolio.html">Portfólio</a></li>
                <li><a href="./contato.html" class="ativo">Contato</a></li>
            </ul>

            <button class="btn-tema" onclick="alternarTema()">Tema (Dia/Noite)</button>
        </nav>
    </header>

    <main>
        <section class="contato">
            <!-- Botões de contato direto -->
            
            <h1>Entre em Contato</h1>
            <div class="botoes-contato">
                <a href="mailto:j_matheusrp@hotmail.com" class="btn-contato">
                    <span class="btn-contato-icone">📧</span>
                    <span class="btn-contato-texto">
                        <strong>E-mail</strong>
                    </span>
                </a>
                <a href="https://linkedin.com/in/jose-matheus-ferreira" target="_blank" class="btn-contato">
                    <span class="btn-contato-icone">🔗</span>
                    <span class="btn-contato-texto">
                        <strong>LinkedIn</strong>
                    </span>
                </a>
            </div>
            
            <p>Ou se preferir, preencha o formulário abaixo e entrarei em contato em breve.</p>
            

            <!-- Formulário — validado pelo JavaScript -->
            <div class="form-container">
                <div id="mensagem-sucesso" class="mensagem-sucesso" style="display:none;">
                    ✅ Mensagem enviada com sucesso!
                </div>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                    <span class="erro" id="erro-nome"></span>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                    <span class="erro" id="erro-email"></span>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem..."></textarea>
                    <span class="erro" id="erro-mensagem"></span>
                </div>

                <button onclick="enviarFormulario()">Enviar mensagem</button>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 José Matheus. Todos os direitos reservados.</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
